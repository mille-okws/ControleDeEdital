<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>IX. Criminalística</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="geral.css">
</head>
<body>

<header class="top-bar">
  <a href="../index.html" class="back">← Voltar</a>
  <h1>IX. Criminalística</h1>

  <div class="progress-wrapper">
    <div class="progress-bar">
      <div class="progress-fill"></div>
      <span class="progress-text">0%</span>
    </div>
  </div>
</header>

<main class="content" data-materia="criminalistica">

  <!-- Criminalística -->
  <section class="bloco">
    <h2>Criminalística</h2>
    <label><input type="checkbox"> Definição, histórico e doutrina</label>
    <label><input type="checkbox"> Requisição de perícia e perícias do CPP</label>
  </section>

  <!-- Locais de Crime -->
  <section class="bloco">
    <h2>Locais de Crime</h2>
    <label><input type="checkbox"> Conceituação e classificação de locais</label>
    <label><input type="checkbox"> Isolamento e preservação de local</label>
  </section>

  <!-- Cadeia de Custódia -->
  <section class="bloco">
    <h2>Cadeia de Custódia</h2>
    <label><input type="checkbox"> Etapas e fases da cadeia de custódia</label>
  </section>

  <!-- Provas -->
  <section class="bloco">
    <h2>Provas</h2>
    <label><input type="checkbox"> Prova: conceito, objetos e objeto da prova</label>
    <label><input type="checkbox"> Tipos: confessional, testemunhal e documental</label>
    <label><input type="checkbox"> Prova pericial (direta e indireta)</label>
  </section>

  <!-- Perícia -->
  <section class="bloco">
    <h2>Perícia</h2>
    <label><input type="checkbox"> Definição, requisição e prazos</label>
    <label><input type="checkbox"> Corpo de delito: Conceito</label>
  </section>

  <!-- Levantamentos -->
  <section class="bloco">
    <h2>Levantamentos</h2>
    <label><input type="checkbox"> Levantamentos contra a pessoa e patrimônio</label>
  </section>

  <!-- Vestígios -->
  <section class="bloco">
    <h2>Vestígios</h2>
    <label><input type="checkbox"> Vestígios forenses e classificações</label>
  </section>

  <!-- Tipos de Crime -->
  <section class="bloco">
    <h2>Tipos de Crime</h2>
    <label><input type="checkbox"> Locais contra a vida e dignidade sexual</label>
  </section>

  <!-- Balística -->
  <section class="bloco">
    <h2>Balística</h2>
    <label><input type="checkbox"> Balística interna, externa e terminal</label>
  </section>

</main>

<script src="geral.js"></script>
</body>
</html>
